<!doctype html><html><head><meta charset="utf-8"><title>Centered wedding title check</title><style>body{margin:10px;background:#ddd;font:14px sans-serif}.preview{display:flex;gap:15px;align-items:start}.preview iframe{zoom:.7}iframe{border:1px solid #aaa;height:500px}.offscreen{position:absolute;left:-10000px;top:0}</style></head><body><p id="result">Checking title alignment…</p><div class="preview"></div><div class="offscreen"></div><script type="module">
for(const width of [1280,375,320,600,760,761,768,900,1050,1051,1100,1200,1201,1920]){const frame=document.createElement('iframe');frame.width=width;frame.src='./#/display';document.querySelector([1280,375].includes(width)?'.preview':'.offscreen').append(frame);}
setTimeout(()=>{document.querySelector('#result').textContent=[...document.querySelectorAll('iframe')].map(frame=>{const doc=frame.contentDocument;const rect=selector=>doc.querySelector(selector).getBoundingClientRect();const heading=rect('.display-heading'),qr=rect('.qr-badge'),title=rect('.couple-title');const overlaps=heading.left<qr.right&&heading.right>qr.left&&heading.top<qr.bottom&&heading.bottom>qr.top;const offset=Math.abs((title.left+title.right)/2-frame.clientWidth/2);const pass=offset<.6&&!overlaps&&doc.documentElement.scrollWidth<=frame.clientWidth;return `${frame.width}: ${pass?'PASS':'FAIL'} (offset ${offset.toFixed(1)}px)`;}).join(' | ');},5000);
</script></body></html>
